project:
  type: website
  output-dir: _site
  execute-dir: project
  render:
    - index.qmd
    - syllabus.qmd
    - slide-library.qmd
    - slides/**/*.qmd
    - modules/**
    - "!references/**"
    - "!amlab/**"
    - "!homework/**"
    - "!data/**"
    - "!tex/**"

execute:
  freeze: auto # re-render only when source changes

# Global citations
bibliography: tex/references.bib

website:
  title: "Applied Math Lab"
  description: "A hands-on introduction to applied mathematical modeling using Python."
  site-url: https://daniprec.github.io/BAM-Applied-Math-Lab
  repo-url: https://github.com/daniprec/BAM-Applied-Math-Lab
  repo-actions: [edit, issue]

  page-navigation: true

  navbar: false

  sidebar:
    style: "docked"
    search: false
    collapse-level: 1
    contents:
      - section: "Getting Started"
        contents:
          - text: "Home"
            href: index.qmd
          - text: "Syllabus"
            href: syllabus.qmd
      - section: "Module 1: Low-Dimensional Dynamics"
        href: modules/low-dimensional-dynamics/index.qmd
        contents:
          - text: "What Is a Mathematical Model?"
            href: modules/low-dimensional-dynamics/what-is-a-model.qmd
          - text: "The Modelling Workflow"
            href: modules/low-dimensional-dynamics/modeling-workflow.qmd
          - text: "The Spruce Budworm Model"
            href: modules/low-dimensional-dynamics/budworm-model.qmd
          - text: "Michaelis-Menten Kinetics"
            href: modules/low-dimensional-dynamics/michaelis-menten.qmd
          - text: "Compartmental Models: SIR and SIS"
            href: modules/low-dimensional-dynamics/compartmental-models.qmd
          - text: "CDIMA: Phase Plane"
            href: modules/low-dimensional-dynamics/cdima-phase-plane.qmd
          - text: "Van der Pol Oscillator"
            href: modules/low-dimensional-dynamics/van-der-pol.qmd
          - text: "FitzHugh-Nagumo Model"
            href: modules/low-dimensional-dynamics/fitzhugh-nagumo.qmd
          - text: "Lorenz Attractor"
            href: modules/low-dimensional-dynamics/lorenz.qmd
      - section: "Module 2: Synchronization and Collective Behaviour"
        href: modules/collective-behaviour/index.qmd
