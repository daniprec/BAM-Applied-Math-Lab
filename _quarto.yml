    left: "By Daniel Precioso Garcelán. Contact: daniel.precioso@ie.edu"
    right:
      - icon: github
        href: https://github.com/daniprec/BAM-Applied-Math-Lab
        aria-label: GitHub

format:
  html:
    theme: cosmo
    css: assets/styles.css
    toc: true
    toc-depth: 4
    number-sections: false
    code-copy: true
    code-fold: false
    code-tools: true
    df-print: paged
    grid:
      sidebar-width: 300px
      body-width: 900px
      margin-width: 300px
      gutter-width: 1.5rem
  revealjs:
    transition: slide
    margin: 0.2
    smaller: false
    subtitle: ''
    output-ext: htm
    toc: true
    toc-depth: 1
    menu: true
    self-contained: true

jupyter: python3

# Inherit some presentation defaults from the project slide template
from: markdown+raw_attribute+raw_tex
standalone: true
slide-level: 2
date-format: long
